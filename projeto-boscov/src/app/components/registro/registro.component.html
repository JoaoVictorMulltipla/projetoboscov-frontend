<h2 mat-dialog-title class="text-center">Criar conta</h2>
<br>
<mat-dialog-content class="dialog-content">
  <form class="form-grid">
    <mat-form-field appearance="outline" class="grid-item">
      <mat-label>Nome</mat-label>
      <input matInput [(ngModel)]="nome" name="nome" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="grid-item">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email" name="email" type="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="grid-item">
      <mat-label>Apelido</mat-label>
      <input matInput [(ngModel)]="apelido" name="apelido" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="grid-item">
      <mat-label>Senha</mat-label>
      <input matInput [(ngModel)]="senha" name="senha" type="password" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data de nascimento</mat-label>
      <input matInput [(ngModel)]="data_nascimento" name="dataNascimento" type="date" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="warn" (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="registrar()">Registrar</button>
</mat-dialog-actions>
