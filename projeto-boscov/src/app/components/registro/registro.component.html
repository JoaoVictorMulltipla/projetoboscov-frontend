<h2 mat-dialog-title>Criar conta</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Nome</mat-label>
    <input matInput [(ngModel)]="nome" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="email" type="email" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Apelido</mat-label>
    <input matInput [(ngModel)]="apelido" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Senha</mat-label>
    <input matInput [(ngModel)]="senha" type="password" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Data de nascimento</mat-label>
    <input matInput [(ngModel)]="data_nascimento" type="date" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="registrar()">Registrar</button>
</mat-dialog-actions>
